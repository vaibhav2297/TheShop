<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Vape Shop Sarnia</title>
    <base href="/" />

    <!-- Open the font-CDN connections first (before any stylesheet request) so fonts arrive as
         early as possible and shrink the swap window that causes layout jerk on a cold load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Barlow Condensed for headings; Space Grotesk for body and controls. -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- App styles -->
    <link rel="stylesheet" href="css/TheShop.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="shop-boot-progress" aria-hidden="true">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="shop-boot-progress-text" role="status"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script type="module" src="js/shopNumericField.js"></script>
    <script type="module" src="js/shopDateField.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
