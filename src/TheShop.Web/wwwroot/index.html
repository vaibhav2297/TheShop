<!DOCTYPE html>
<html lang="en"
      style="height:100%">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Vape Shop Sarnia</title>
    <base href="/" />

    <!-- Open the font-CDN connections first (before any stylesheet request) so fonts arrive as
         early as possible and shrink the swap window that causes layout jerk on a cold load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- All app fonts in one request: Barlow Condensed (headings H1–H4), Space Grotesk (body/UI),
         Roboto (MudBlazor default). -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Roboto:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- MudBlazor -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/CodeBeam.MudBlazor.Extensions/MudExtensions.min.css" rel="stylesheet" />

    <!-- App styles -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/TheShop.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TheShop.Web.styles.css" rel="stylesheet" />

    <script type="importmap"></script>
</head>

<body style="height:100%">
    <div id="app"
         class="mud-height-full">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- MudBlazor -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/CodeBeam.MudBlazor.Extensions/MudExtensions.min.js"></script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
